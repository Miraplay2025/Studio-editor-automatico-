name: Build e Assinar APK Android

on:
  workflow_dispatch:

env:
  # Configurações de performance, headless e memória da JVM/Gradle
  GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false -Xmx4096m -XX:MaxMetaspaceSize=1024m"

jobs:
  build:
    name: Compilar e Assinar APK
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código-fonte do repositório
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Java/JDK 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configurar o Android SDK e aceitar licenças automaticamente
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      # 4. Configurar Gradle Action (gerencia cache e permissões automaticamente)
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      # 5. Garantir Permissão de Execução no Gradle Wrapper
      - name: Conceder Permissão ao Gradle Wrapper
        run: chmod +x gradlew

      # 6. Limpar e Compilar o APK Release usando Gradle
      - name: Compilar APK (Release)
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      # 7. Gerar Chave de Assinatura e Assinar o APK
      - name: Assinar APK para Instalação no Android
        run: |
          # Localizar o APK gerado
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Erro: APK não encontrado no diretório app/build/outputs/apk/release/" && exit 1
          fi
          
          echo "APK encontrado em: $UNSIGNED_APK"
          
          # Criar keystore temporária para assinatura
          keytool -genkey -v -keystore release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=CineCut, OU=Dev, O=CineCut, L=City, S=State, C=BR"
          
          # Encontrar dinamicamente a versão mais recente das Build-Tools instaladas
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Utilizando Build-Tools localizadas em: $BUILD_TOOLS_DIR"
          
          # Garantir o alinhamento de memória (zipalign)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          
          # Assinar o APK (v1, v2 e v3 signatures)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out CineCut-Signed.apk app-aligned.apk
          
          echo "APK assinado com sucesso!"

      # 8. Upload do APK final assinado como Artefato
      - name: Salvar APK nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: CineCut-APK-Assinado
          path: CineCut-Signed.apk
          retention-days: 7
